  #     summary: Retrieves a single event
  #     parameters:
  #       - name: event_id
  #         in: path
  #         required: true
  #         schema:
  #           type: string
  #         description: Returns event
  #       - name: pricing
  #         in: query
  #         required: false
  #         schema:
  #           type: boolean
  #           default: true
  #         description: Whether to return pricing information for the event.
  #       - name: linguistics
  #         in: query
  #         required: false
  #         schema:
  #           type: boolean
  #           default: true
  #         description: Whether to return summary of the event.
  #     responses:
  #       "200":
  #         description: An event object
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/Event"
  #       default:
