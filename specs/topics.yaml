  /topics:
    get:
      operationId: getTopics
      description: Retrieves list of topics
      summary: Retrieves a list of topics that match the parameters provided.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
        - name: from_index
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: An array of event objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topics"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  schemas:
    Topics:
      type: object
      properties:
        topic_id:
          type: string
        topic_name:
          type: string
        
              
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
