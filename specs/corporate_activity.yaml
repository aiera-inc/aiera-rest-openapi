components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  schemas:
    CorporateActivities:
      type: object
      properties:
        params:
          type: object
        count:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/CorporateActivityDetails"


    CorporateCoverage:
      type: object
      properties:
        counts:
          type: object
          properties:
            mapped:
              type: object
              properties:
                companies:
                  type: integer
                equities:
                  type: integer
                gics_sectors:
                  type: object
                  properties:
                    type: integer
                  example:
                    "Consumer Discretionary": 1
                gics_subsectors:
                  type: object
                  properties:
                    type: integer
                  example:
                    "Broadline Retail": 1
                countries:
                  type: object
                  properties:
                    type: integer
                  example:
                    US: 1
                regions:
                  type: object
                  properties:
                    type: integer
                  example:
                    Americas: 1
                subregions:
                  type: object
                  properties:
                    type: integer
                  example:
                    North America: 1
            unmapped:
              type: object
              properties:
                listed:
                  type: integer
                delisted:
                  type: integer
        results:
          type: object
          properties:
            mapped:
              type: array
              items:
                type: object
                properties:
                  company_id:
                    type: integer
                  name:
                    type: string
                  country:
                    type: string
                  region:
                    type: string
                  subregion:
                    type: string
                  equities:
                    type: array
                    items:
                      type: object
                      properties:
                        equity_id:
                          type: integer
                        bloomberg_ticker:
                          type: string
                        local_ticker:
                          type: string
                        ric:
                          type: string
                        isin:
                          type: string
                        cusip:
                          type: string
                        permid:
                          type: string
                        mic:
                          type: string
                        gics_sector:
                          type: string
                        gics_subsector:
                          type: string
            unmapped:
              type: array
              items:
                type: object


    CorporateActivityDetails:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        subtype:
          type: string
        when:
          type: string
          format: date-time
        date_is_exact:
          type: boolean
        is_tentative:
          type: boolean
        is_estimated:
          type: boolean
        is_postponed:
          type: boolean
        is_cancelled:
          type: boolean
        raw_identifiers:
          type: object
          properties:
            isin:
              type: string
            cusip:
              type: string
            comapny_name:
              type: string
            delisted:
              type: boolean
        event:
          $ref: "#/components/schemas/Event"
        equity:
          $ref: "#/components/schemas/Equity"
        related_ids:
          type: array
          items:
            type: string
        metadata:
          type: object
          properties:
            contact:
              "#/components/schemas/ContactDetails"
            speakers:
              type: String
            webcasts:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                  description::
                    type: string
            regarding:
              type: string
            callDetails:
              type: object
              properties:
                dialInNumber:
                  type: string
            localLanguage:
              type: boolean
            replayDetails:
              type: object
              properties:
                date:
                  type: string
                  format: date-time
                timeZone:
                  type: string
                dialInEnds:
                  type: string
                  format: date-time
                webcastUrl:
                  type: string
            preRegistration:
              type: boolean
            preRegistrationUrl:
              type: string
        explaination:
          type: string
        audit:
          type: array
          items:
            change_date:
              type: string
              format: date-time
            change_type:  
              type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time

    ContactDetails:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        telephone:
          type: string

    Event:
      type: object
      properties:
        event_id:
          type: integer
        event_title:
          type: string
        event_type: 
          type: string
        event_date:
          type: string
          format: date-time
        has_unknown_time:
          type: boolean
        broadcase_url:
          type: string
        replay_url:     
          type: string  
        conference_number:
          type: string
        conference_pin:
          type: string
        slides_url:
          type: string
        slides_url_type:
          type: string
        press_url:
          type: string
        press_url_type:
          type: string
        transcription_status:
          type: string
        transcription_audio_url:
          type: string
        status:
          type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time

    Equity:
      type: object
      properties:
        equity_id:
          type: integer
        company_id:
          type: integer
        comapny_name:
          type: string
        local_ticker:
          type: string
        bloomberg_ticker:
          type: string
        ric:
          type: string
        permid:
          type: string
        isin:
          type: string
        cusip:
          type: string
        exchange_mic:
          type: string

