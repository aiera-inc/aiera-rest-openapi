openapi: 3.1.0

info:
  title: Aiera Corporate Activity API
  description: API for accessing corporate activity data from Aiera
  version: 1.0.0
servers:
  - url: https://premium.aiera.com/api
security:
  - ApiKeyAuth: []
paths:
  /corporate-activity:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getCorporateActivity
      summary: Retrieve corporate activities.
      description: Fetch corporate activity data based on various filters.
      parameters:
        - name: start_date
          in: query
          required: true
          description: Filter activities starting from this date.
          schema:
            type: string
            format: date-time
            default: datetime.date.today() - datetime.timedelta(days=28)
        - name: end_date
          in: query
          required: true
          description: Filter activities up to this date.
          schema:
            type: string
            format: date-time
            default: datetime.date.today() + datetime.timedelta(days=28)
        - name: modified_since
          in: query
          required: false
          description: Return activities modified since this date.
          schema:
            type: string
            format: date-time
        - name: activity_type
          in: query
          required: false
          description: Filter by activity type (e.g., earnings, presentation).
          schema:
            type: string
        - name: activity_subtype
          in: query
          required: false
          description: Filter by activity subtype.
          schema:
            type: string
        - name: bloomberg_ticker
          in: query
          required: true
          description: Filter activities by Bloomberg ticker.
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: Number of records to return, max 1000.
          schema:
            type: integer
        - name: from_index
          in: query
          required: false
          description: Index to start returning results from.
          schema:
            type: integer
      responses:
        "200":
          description: A list of corporate activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateActivities"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /corporate-activity/coverage:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getCorporateActivityCoverage
      summary: Retrieve equities coverage.
      description: Retrieve details of equities covered by the corporate activity API.
      parameters:
        - name: bloomberg_ticker
          in: query
          required: true
          description: |
            Retrieve details of equities covered by the corporate activity API.
            - If `bloomberg_ticker` is provided, returns details specific to the given ticker.
            - If `bloomberg_ticker` is not provided, returns general equities coverage.
          schema:
            type: string
            default: ALL
        - name: isin
          in: query
          required: false
          description: Filter by ISIN.
          schema:
            type: string
        - name: company_rollup
          in: query
          required: false
          description: Roll up results to the company level.
          schema:
            type: boolean
        - include_details:
          in: query
          required: false
          description: Include detailed information about the equities.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Details of covered equities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateCoverage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /corporate-activity/{corporate_activity_id}:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getCorporateActivityById
      summary: Retrieve corporate activity by ID.
      description: Fetch details of a specific corporate activity by its ID.
      parameters:
        - name: corporate_activity_id
          in: path
          required: true
          description: The unique identifier of the corporate activity.
          schema:
            type: string
        - name: include_details
          in: query
          required: false
          description: Include detailed information about the corporate activity.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Corporate activity details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateActivityDetails"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

