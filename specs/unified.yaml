      parameters:
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
            description: Fetch events on or after this date (defaults to 2 weeks ago)
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Fetch events on or before this date (defaults to 2 weeks from now)
        - name: bloomberg_ticker
          in: query
          description: Filter events to 1+ bloomberg tickers always including country codes with colon (comma-separated).
          required: true
          schema:
            type: string
        - name: isin
          in: query
          required: false
          schema:
            type: string
        - name: ric   
          in: query
          required: false
          schema:
            type: string
        - name: permid
          in: query
          required: false
          schema:
            type: string
        - name: summary_type
          in: query
          required: false
          schema:
            type: string
            default: zeroshot
        - name: version
          in: query
          required: false
          schema:
            type: string
        - name: from_index
          in: query
          required: false
          schema:
