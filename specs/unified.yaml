                    type: object
                  results:
                    type: object

  /calendar/{event_id}:
    get:
      summary: Get Calendar Event by ID
      operationId: getCalendarById
      description: Retrieve details of a specific calendar event by its ID.
      parameters:
        - name: event_id
          in: path
          description: The unique identifier of the event.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Calendar event details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"

  /events/audio/transcript/csv:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getEventTranscripts
      description: Retrieves a csv file of the event transcript.
      summary: Retrieves a csv file of a event transcript.
      parameters:
        - name: event_ids
          in: query
          required: true
          schema:
            type: string
          description: ID of the event.
      responses:
        "200":
          description: Successfully uploaded the csv file.
          content:
            application/csv:
              schema:
                type: string
                format: binary
          headers:
            content-disposition:
              schema:
                type: string
                description: Used only with `application/pdf` responses
                example: attachment; filename="name.pdf"
            content-encoding:
              schema:
                type: string
                description: Encoding of the file.

  /events/{event_id}:
    get:
      operationId: getEvent
      description: Retrieves an event using an event id.
      summary: Retrieves a single event
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          description: Returns event
        - name: pricing
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to return pricing information for the event.
        - name: linguistics
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to return summary of the event.
      responses:
        "200":
          description: An event object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Events"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events:
    get:
      operationId: getEvents
      description: Retrieves a events that match the parameters provided.
      summary: Retrieves a list of events that match the parameters provided.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: modified_since
          in: query
          required: false
          schema:
            type: string
          description: Returns events modified since this date
        - name: bloomberg_ticker
          in: query
          required: true
          schema:
            type: string
          description: Filter events to 1+ bloomberg tickers always including country codes with colon (comma-separated).
        - name: event_type
          in: query
          required: false
          schema:
            type: string
            default: earnings
          description: Event type, must be earnings
        - name: start_date
          in: query
          required: true
          schema:
            type: string
          description: Fetch events on or after this date (defaults to 2 weeks ago)
        - name: end_date
          in: query
          required: true
          schema:
            type: string
          description: Fetch events on or before this date (defaults to 2 weeks from now)
      responses:
        "200":
          description: An array of event objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Events"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dashboards/{dashboard_guid}/streams/{stream_guid}/matches:
    get:
      operationId: getMatch
      description: Retrieves a stream match using a dashboard guid and stream guid.
      summary: Retrieves a single match
      parameters:
        - name: dashboard_guid
          in: path
          required: true
          schema:
            type: integer
          description: Returns match
        - name: stream_guid
          in: path
          required: true
          schema:
            type: integer
          description: Returns match
        - name: start_date
          in: query
          required: true
          schema:
            type: string
          description: Fetch events on or after this date (defaults to 2 weeks ago)
        - name: end_date
          in: query
          required: true
          schema:
            type: string
          description: Fetch events on or before this date (defaults to 2 weeks from now)
        - name: linguistics
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to return summary of the event.
        - name: collapse
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to collapse the match
        - name: collapse_size
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Number of matches to collapse
        - name: next_page_token
          in: query
          required: false
          schema:
            type: string
          description: Token to fetch the next page of matches
        - name: from_index
          in: query
          required: false
          schema:
            type: integer
          description: Index to start fetching matches from
        - name: size  
          in: query
          required: false
          schema:
            type: integer
          description: Number of matches to return
      responses:
        "200":
          description: A match object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

