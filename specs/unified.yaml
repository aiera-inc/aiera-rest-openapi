openapi: 3.1.0
info:
  title: Aiera REST API
  description: REST API for accessing financial data from Aiera
  version: 1.0.0
servers:
  - url: https://premium.aiera.com/api
security:
  - ApiKeyAuth: []
paths:
  /equities-v2: 
    get:  
      operationId: getEquities
      description: Retrieves a list of equities 
      summary: Retrieves a list of equities for the respective bloomberg ticker
      security: 
        - ApiKeyAuth: []
      parameters:
        - name: bloomberg_ticker
          in: query
          required: true
          schema:
            type: string
          description:  Filter activities to 1+ bloomberg tickers always including country codes with colon (comma-separated).
        - name: isin
          in: query
          schema:
            type: string
          description: ISIN (International Securities Identification Number) of the equity.
        - name: ric
          in: query
          schema:
            type: string
          description: Reuters Instrument Code of the equity.
        - name: ticker
          in: query
          schema:
            type: string
          description: Local ticker of the equity.
        - name: permid
          in: query
          schema:
            type: string
          description: PermID of the equity.
        - name: sector_id
          in: query
          schema:
            type: integer
          description: ID of the sector.
        - name: subsector_id
          in: query
          schema:
            type: integer
          description: ID of the subsector.
        - name: search
          in: query
          schema:
            type: string
          description: Search term for equity names or tickers.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - name: page_size
          in: query
          schema:
            type: integer
            default: 100
            maximum: 2500
            minimum: 10
          description: Number of records per page.
        - name: include_inactive
          in: query
          schema:
            type: boolean
          description: Whether to include inactive equities.
        - name: include_company_metadata
          in: query
          schema:
            type: boolean
            default: true

          description: Whether to include associated company metadata.
      responses:
        '200':
          description: A list of equities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Equity2"
        default:
            description: unexpected error
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"

  /equities-v2/{equity_id}:
    get:
      operationId: get equity info by equity id
      description: Retrieves equities by equity id
      summary: Retrieves the appropriate equity by equity id.
      security:
        - ApiKeyAuth: [] 
      parameters:
        - name: equity_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the equity.
        - name: include_company_metadata=true
          in: query
          schema:
            type: boolean
            default: true
          description: Whether to include associated company metadata.
      responses:
        "200":
          description: An array of equity objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equity2"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /topics/{topic_id}:
    get:
      operationId: getEvent
      description: Retrieves an event using an event id.
      summary: Retrieves a single event
      parameters:
        - name: topic_id
          in: path
          required: true
          schema:
            type: string
          description: Returns topic
        - name: include_metrics
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: An event object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topics"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /topics:
    get:
      operationId: getTopics
      description: Retrieves list of topics
      summary: Retrieves a list of topics that match the parameters provided.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
        - name: from_index
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: An array of topic objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topics"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /topics/from_equities:
    get:
      operationId: getTopicsAndEquitiesCount
      description: Retrieves list of topics and equities
      summary: Retrieves a list of topics and equities that match the parameters provided.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
        - name: from_index
          in: query
          required: false
          schema:
            type: integer

      responses:
        "200":
          description: An array of event objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquityTopics"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /topics/from_events:
    get:
      operationId: getTopicsAndEventCount
      description: Retrieves list of topics and events count
      summary: Retrieves a list of topics and event counts that match the parameters provided.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
        - name: from_index
          in: query
          required: false
          schema:
            type: integer

      responses:
        "200":
          description: An array of event objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventTopics"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /topics/{topic_id}/equities:
    get:
      operationId: getEquities
      description: Retrieves list of equities for a topic by topic_id only
      summary: Retrieves a list of equities that match the parameters provided.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: topic_id
          in: path
          required: true
          schema:
            type: string
          description: Returns equities for a topic
        - name: size
          in: query
          required: false
          schema:
            type: integer
        - name: from_index
          in: query
          required: false
          schema:
            type: integer

      responses:
        "200":
          description: An array of event objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquityByTopicId"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /topics/{topic_id}/events:
    get:
      operationId: getEvents
      description: Retrieves list of events for a topic by topic_id
      summary: Retrieves a list of events that match the parameters provided.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: topic_id
          in: path
          required: true
          schema:
            type: string
          description: Returns events for a topic
        - name: size
          in: query
          required: false
          schema:
            type: integer
        - name: from_index
          in: query
          required: false
          schema:
            type: integer

      responses:
        "200":
          description: An array of event objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventsByTopicId"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /equities-v2/sectors:
    get:
      operationId: get sectors and sub-sectors
      description: Retrieves sectors and subsectors
      summary: Retrieves a list of sectors along with their subsectors.
      security:
        - ApiKeyAuth: [] 
      responses:
        "200":
          description: An array of sector objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
   
 
  /corporate-activity:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getCorporateActivity
      summary: Retrieve corporate activities.
      description: Fetch corporate activity data based on various filters.
      parameters:
        - name: start_date
          in: query
          required: true
          description: Fetch events on or after this date (defaults to 2 weeks ago)
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: true
          description: Fetch events on or before this date (defaults to 2 weeks afrom now)
          schema:
            type: string
            format: date-time
        - name: modified_since
          in: query
          required: false
          description: Return activities modified since this date.
          schema:
            type: string
            format: date-time
        - name: activity_type
          in: query
          required: false
          description: Filter by activity type (e.g., earnings, presentation).
          schema:
            type: string
        - name: activity_subtype
          in: query
          required: false
          description: Filter by activity subtype.
          schema:
            type: string
        - name: bloomberg_ticker
          in: query
          required: true
          description: Filter activities to 1+ bloomberg tickers always including country codes with colon (comma-separated).
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: Number of records to return, max 1000.
          schema:
            type: integer
        - name: from_index
          in: query
          required: false
          description: Index to start returning results from.
          schema:
            type: integer
      responses:
        "200":
          description: A list of corporate activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateActivities"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /corporate-activity/coverage:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getCorporateActivityCoverage
      summary: Retrieve equities coverage.
      description: Retrieve details of equities covered by the corporate activity API.
      parameters:
        - name: bloomberg_ticker
          in: query
          required: true
          description: Fetch events on or after this date (defaults to 2 weeks ago)
          schema:
            type: string
            default: ALL
        - name: isin
          in: query
          required: false
          description: Filter by ISIN.
          schema:
            type: string
        - name: company_rollup
          in: query
          required: false
          description: Roll up results to the company level.
          schema:
            type: boolean
        - name: include_details
          in: query
          required: false
          description: Include detailed information about the equities.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Details of covered equities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateCoverage"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /corporate-activity/{corporate_activity_id}:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getCorporateActivityById
      summary: Retrieve corporate activity by ID.
      description: Fetch details of a specific corporate activity by its ID.
      parameters:
        - name: corporate_activity_id
          in: path
          required: true
          description: The unique identifier of the corporate activity.
          schema:
            type: string
        - name: include_details
          in: query
          required: false
          description: Include detailed information about the corporate activity.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Corporate activity details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateActivityDetails"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /corporate-activity/audits:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getCorporateActivityAuditDetails
      summary: Retrieve corporate activity audit trails.
      description: Fetch audit logs for corporate activities.
      parameters:
        - name: start_date
          in: query
          required: true
          description: Filter audits starting from this date.
          schema:
            type: string
            format: date-time  26 x 7
            default: datetime.date.today() - datetime.timedelta(days=182)
        - name: end_date
          in: query
          required: true
          description: Filter audits up to this date.
          schema:
            type: string
            format: date-time
            default: datetime.date.today() + datetime.timedelta(days=182)
        - name: modified_since
          in: query
          required: false
          description: Return audits modified since this date.
          schema:
            type: string
            format: date-time
        - name: bloomberg_ticker
          in: query
          required: true
          description: Filter audits by Bloomberg ticker.
          schema:
            type: string
        - name: isin
          in: query
          required: false
          description: Filter audits by ISIN.
          schema:
            type: string
        - name: cusip
          in: query
          required: false
          description: Filter audits by CUSIP.
          schema:
            type: string
        - name: ric
          in: query
          required: false
          description: Filter audits by Reuters/Refinitiv RIC.
          schema:
            type: string
        - name: permid
          in: query
          required: false
          description: Filter audits by PermID.
          schema:
            type: string
        - name: watchlist_id
          in: query
          required: false
          description: Filter audits by watchlist ID.
          schema:
            type: string
        - name: activity_type
          in: query
          required: false
          description: Filter by activity type.
          schema:
            type: string
        - name: activity_subtype
          in: query
          required: false
          description: Filter by activity subtype.
          schema:
            type: string
        - name: size
          in: query
          required: true
          description: Number of records to return, max 1000.
          schema:
            type: object
            default: 100
        - name: from_index
          in: query
          required: true
          description: Index to start returning results from.
          schema:
            type: object 
            default: 0
        - name: include_activity
          in: query
          required: false
          description: Include detailed information about the corporate activity.
          schema:
            type: boolean
            default: true 
      responses:
        "200":
          description: A list of corporate activity audits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateActivityAudits"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /content/filings:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getFilings
      description:  Retrieves filings content for specific equities or filters such as form number, date range, or ticker symbol.
        You can provide a `bloomberg_ticker` (e.g., "AMZN:US"), `start_date`, `end_date` to filter filings within
        a specific date range for a specific equity.
      summary: Retrieves filings content according to parameters.
      parameters:
        - name: form_number
          in: query
          required: false
          schema:
            type: string
          description: Form number to filter filings content by.
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Fetch events on or after this date (defaults to 2 weeks ago) (YYYY-MM-DD)
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Fetch events on or before this date (defaults to 2 weeks later) (YYYY-MM-DD)
        - name: bloomberg_ticker
          in: query
          required: true
          schema:
            type: string
          description: Filter events to 1+ bloomberg tickers always including country codes with colon (comma-separated).
        - name: isin
          in: query
          required: false
          schema:
            type: string
          description: ISIN to filter filings content by.
        - name: ric
          in: query
          required: false
          schema:
            type: string
          description: Reuters/Refinitiv RIC to filter filings content by.
        - name: permid
          in: query
          required: false
          schema:
            type: string
          description: PermID to filter filings content by.
        - name: ticker
          in: query
          required: false
          schema:
            type: string
          description: Ticker symbol to filter filings content by.
        - name: from_id
          in: query
          required: false
          schema:
            type: integer
          description: Return items with an ID greater than this.
        - name: from_index
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Starting index for pagination.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 100
          description: Number of items to return (maximum 100).
      responses:
        "200":
          description: Successfully retrieved filings content.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Filings"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /content/news:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getNews
      description: Retrieves news content for specific equities or filters such as form number, date range, or ticker symbol.
        You can provide a `bloomberg_ticker` (e.g., "AMZN:US"), `start_date`,  `end_date` and `news_source_id` to filter news within
        a specific date range for a specific equity.
      summary: Retrieves news content by equity.
      parameters:
        - name: news_source_id
          in: query
          required: true
          schema:
            type: integer
          description: Return items with an ID greater than this.
        - name: start_date
          in: query
          required: true
          description: Fetch events on or after this date (defaults to 2 weeks ago)
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: true
          description:  Fetch events on or before this date (defaults to 2 weeks from now)
          schema:
            type: string
            format: date-time
        - name: bloomberg_ticker
          in: query
          required: true
          schema:
            type: string
          description: Filter events to 1+ bloomberg tickers always including country codes with colon (comma-separated).
        - name: isin
          in: query
          required: false
          schema:
            type: string
          description: ISIN to filter news content by.
        - name: ric
          in: query
          required: false
          schema:
            type: string
          description: Reuters/Refinitiv RIC to filter news content by.
        - name: permid
          in: query
          required: false
          schema:
            type: string
          description: PermID to filter news content by.
        - name: ticker
          in: query
          required: false
          schema:
            type: string
          description: Ticker symbol to filter news content by.
        - name: from_id
          in: query
          required: false
          schema:
            type: integer
          description: Return items with an ID greater than this.
        - name: from_index
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Starting index for pagination.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 100
          description: Number of items to return (maximum 100).
      responses:
        "200":
          description: Successfully retrieved news content.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/News"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /calendar:
    get:
      security:
        - ApiKeyAuth: []
      operationId: getCalendar
      summary: Retrieves a calendar object.
      description: Fetch calendar events filtered by equity, watchlist, or other parameters.
      parameters:
        - name: modified_since
          in: query
          required: false
          description: Returns events modified since this date.
          schema:
            type: string
            format: date-time
            example: "2024-10-31T23:59:59.999999"
        - name: event_type
          in: query
          required: false
          description: Filter by event type.
          schema:
            type: string
            default: earnings
        - name: start_date
          in: query
          description: Fetch events on or after this date (defaults to 2 weeks ago)
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: Fetch events on or before this date (defaults to 2 weeks from now)
          required: false
          schema:
            type: string
            format: date-time
        - name: bloomberg_ticker
          in: query
          required: true
          description: Filter events to 1+ bloomberg tickers always including country codes with colon (comma-separated).
          schema:
            type: string
        - name: isin
          in: query
          required: false
          description: Filter events to ISINs (comma-separated).
          schema:
            type: string
        - name: permid
          in: query
          required: false
          description: Filter events to PermID identifiers (comma-separated).
          schema:
            type: string
        - name: ric
          in: query
          required: false
          description: Filter events to Reuters RICs (comma-separated).
          schema:
            type: string
        - name: ticker
          in: query
          required: false
          description: Filter events to local tickers (comma-separated).
          schema:
            type: string
        - name: watchlist_id
          in: query
          required: false
          description: Filter events to watchlist IDs (comma-separated).
          schema:
            type: integer
        - name: company_rollup
          in: query
          required: false
          description: Whether to roll up matches to the company entity.
          schema:
            type: boolean
        - name: include_deleted
          in: query
          required: false
          description: Whether to include deleted event records.
          schema:
            type: boolean
        - name: include_private
          in: query
          required: false
          description: Whether to include private events.
          schema:
            type: boolean
        - name: from_index
          in: query
          required: false
          description: Index to start returning results from.
          schema:
            type: integer
        - name: size
          in: query
          required: false
          description: Number of events to return, max 1000.
          schema:
            type: integer
        - name: sort_key
          in: query
          required: false
          description: Sort results by event_id_asc, event_id_desc, event_date_asc (default), or event_date_desc.
          schema:
            type: string
      
      responses:
        "200":
          description: A calendar object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /calendar/coverage:
    get:
      summary: Get Equities Coverage
      description: Retrieve information about equities covered by the API.
      operationId: getCalendarCoverage
      parameters:
        - name: bloomberg_ticker
          in: query
          description: Filter events to 1+ bloomberg tickers always including country codes with colon (comma-separated).
          required: false
          schema:
            type: string
        - name: isin
          in: query
          description: ISIN filter.
          required: false
          schema:
            type: string
        - name: cusip
          in: query
          description: CUSIP filter.
          required: false
          schema:
            type: string
        - name: ric
          in: query
          description: Reuters/Refinitiv RIC filter.
          required: false
          schema:
            type: string
        - name: ticker
          in: query
          description: Ticker filter.
          required: false
          schema:
            type: string
        - name: permid
          in: query
          description: PermID filter.
          required: false
          schema:
            type: string
        - name: watchlist_id
          in: query
          description: Watchlist ID filter.
          required: false
          schema:
            type: integer
        - name: company_rollup
          in: query
          description: Rollup to all company equities.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Equities coverage details.
          content:
            application/json:
              schema:
                type: object
